name: Windows portable exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.13.0). Leave empty to only upload a workflow artifact."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"
    branches: [main]
    paths:
      - "app/**"
      - "assets/**"
      - "native_bridge/**"
      - "packaging/windows/**"
      - "requirements.txt"
      - ".github/workflows/windows-portable.yml"
  pull_request:
    paths:
      - "app/**"
      - "assets/**"
      - "native_bridge/**"
      - "packaging/windows/**"
      - "requirements.txt"
      - ".github/workflows/windows-portable.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native bridge
        working-directory: native_bridge
        run: cargo build --release

      - name: Stage bridge binary
        shell: pwsh
        run: |
          Copy-Item -Force `
            "native_bridge\target\release\farever-atlas-bridge.exe" `
            "native_bridge\farever-atlas-bridge.exe"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Prepare UI fonts
        env:
          PYTHONPATH: app
        run: python -m farever_atlas.fonts

      - name: Build portable exe
        run: |
          python -m PyInstaller --noconfirm --clean `
            --distpath dist `
            --workpath build\pyinstaller `
            packaging\windows\farever_atlas.spec

      - name: Verify exe and write SHA256
        shell: pwsh
        run: |
          $exe = "dist\FareverAtlas.exe"
          if (-not (Test-Path $exe)) {
            throw "dist\FareverAtlas.exe was not produced"
          }
          Get-Item $exe | Format-List Name, Length, LastWriteTime
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path "dist\FareverAtlas.exe.sha256" -Value "$hash  FareverAtlas.exe`n"
          Write-Host "SHA256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FareverAtlas-windows-portable
          path: |
            dist/FareverAtlas.exe
            dist/FareverAtlas.exe.sha256
          if-no-files-found: error

      - name: Resolve release tag
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=""
          prerelease="false"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            prerelease="${{ github.event.release.prerelease }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            prerelease="${{ inputs.prerelease }}"
          fi
          exists="false"
          if [[ -n "${tag}" ]] && gh release view "${tag}" >/dev/null 2>&1; then
            exists="true"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "exists=${exists}" >> "$GITHUB_OUTPUT"
          if [[ -n "${tag}" ]]; then
            echo "Publishing release assets for tag ${tag} (exists=${exists})"
          else
            echo "No release tag; skipping GitHub Release upload"
          fi

      - name: Attach exe to GitHub Release
        id: release
        if: steps.release_meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          # Only auto-generate notes on first create; re-runs must not append again.
          generate_release_notes: ${{ steps.release_meta.outputs.exists != 'true' }}
          files: |
            dist/FareverAtlas.exe
            dist/FareverAtlas.exe.sha256

      - name: Prepare VirusTotal API key
        id: vt_key
        if: steps.release_meta.outputs.tag != '' && steps.release.outputs.id != ''
        shell: bash
        env:
          RAW_VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          # Trim whitespace/newlines/quotes that often sneak in via paste.
          key="$(printf '%s' "$RAW_VT_API_KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          if [[ -z "$key" ]]; then
            echo "::error::VT_API_KEY secret is empty"
            exit 1
          fi
          echo "::add-mask::${key}"
          echo "VT_API_KEY length=${#key}"
          # Diagnose paste problems without printing the secret.
          python - <<'PY'
          import os, re, sys
          key = os.environ["RAW_VT_API_KEY"]
          key = key.replace("\r", "").replace("\n", "").strip().strip("\"'")
          print(f"trimmed_length={len(key)}")
          print(f"has_whitespace={any(ch.isspace() for ch in key)}")
          print(f"is_hex64={bool(re.fullmatch(r'[0-9a-fA-F]{64}', key))}")
          print(f"is_alnum_dash={bool(re.fullmatch(r'[A-Za-z0-9_-]{16,}', key))}")
          print(f"unique_non_alnum={sorted({ch for ch in key if not ch.isalnum()})}")
          PY
          # Sanity-check credentials before uploading the large exe.
          code="$(curl -sS -o /tmp/vt-me.json -w '%{http_code}' \
            -H "x-apikey: ${key}" \
            -H "Accept: application/json" \
            https://www.virustotal.com/api/v3/users/me)"
          echo "VirusTotal /users/me HTTP ${code}"
          if [[ "$code" != "200" ]]; then
            echo "::error::VirusTotal rejected VT_API_KEY (HTTP ${code}). Re-copy the key from https://www.virustotal.com/gui/my-apikey (API key, not the password or a file hash)."
            head -c 400 /tmp/vt-me.json || true
            echo
            exit 1
          fi
          {
            echo "value<<EOF"
            printf '%s\n' "$key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Strip previous VirusTotal release notes
        if: steps.vt_key.outputs.value != '' && steps.release_meta.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          body="$(gh release view "${TAG}" --json body --jq -r .body)"
          # Drop any previously appended VirusTotal section so re-runs replace it.
          cleaned="$(printf '%s\n' "${body}" | awk 'BEGIN{p=1} /^(\*\*)?VirusTotal(\*\*)?[[:space:]]*$/{p=0} p')"
          cleaned="$(printf '%s\n' "${cleaned}" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
          notes_file="$(mktemp)"
          printf '%s\n' "${cleaned}" > "${notes_file}"
          gh release edit "${TAG}" --notes-file "${notes_file}"
          rm -f "${notes_file}"

      - name: VirusTotal scan release assets
        if: steps.vt_key.outputs.value != ''
        uses: cssnr/virustotal-action@v2
        with:
          vt_api_key: ${{ steps.vt_key.outputs.value }}
          release_id: ${{ steps.release.outputs.id }}
          update_release: true
          sha256: true
          release_heading: "**VirusTotal**"
          rate_limit: 4
