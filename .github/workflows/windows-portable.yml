name: FareverAtlas.exe

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/**"
      - "native_bridge/**"
      - "packaging/windows/**"
      - "requirements.txt"
      - ".github/workflows/windows-portable.yml"
  pull_request:
    paths:
      - "app/**"
      - "assets/**"
      - "native_bridge/**"
      - "packaging/windows/**"
      - "requirements.txt"
      - ".github/workflows/windows-portable.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native bridge
        working-directory: native_bridge
        run: cargo build --release

      - name: Stage bridge binary
        shell: pwsh
        run: |
          Copy-Item -Force `
            "native_bridge\target\release\farever-atlas-bridge.exe" `
            "native_bridge\farever-atlas-bridge.exe"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Prepare UI fonts
        env:
          PYTHONPATH: app
        run: python -m farever_atlas.fonts

      - name: Build portable exe
        run: |
          python -m PyInstaller --noconfirm --clean `
            --distpath dist `
            --workpath build\pyinstaller `
            packaging\windows\farever_atlas.spec

      - name: Verify exe and write SHA256
        shell: pwsh
        run: |
          $exe = "dist\FareverAtlas.exe"
          if (-not (Test-Path $exe)) {
            throw "dist\FareverAtlas.exe was not produced"
          }
          Get-Item $exe | Format-List Name, Length, LastWriteTime
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Path "dist\FareverAtlas.exe.sha256" -Value "$hash  FareverAtlas.exe`n"
          Write-Host "SHA256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FareverAtlas-windows-portable
          path: |
            dist/FareverAtlas.exe
            dist/FareverAtlas.exe.sha256
          if-no-files-found: error

      - name: Resolve Nightly release
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="Nightly"
          fi
          exists="false"
          if [[ -n "${tag}" ]] && gh release view "${tag}" >/dev/null 2>&1; then
            exists="true"
          fi
          sha="$(git rev-parse --short HEAD)"
          stamp="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          body="Nightly portable Windows build from ${sha} (${stamp})."
          {
            echo "tag=${tag}"
            echo "exists=${exists}"
            echo "body<<EOF"
            printf '%s\n' "${body}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "${tag}" ]]; then
            echo "Publishing Nightly release (exists=${exists}, sha=${sha})"
          else
            echo "No Nightly publish for event ${{ github.event_name }}; artifact only"
          fi

      - name: Attach exe to Nightly release
        id: release
        if: steps.release_meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Nightly
          name: Nightly
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: ${{ steps.release_meta.outputs.body }}
          files: |
            dist/FareverAtlas.exe
            dist/FareverAtlas.exe.sha256

      - name: Prepare VirusTotal API key
        id: vt_key
        if: steps.release_meta.outputs.tag != '' && steps.release.outputs.id != ''
        shell: bash
        env:
          RAW_VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          # Trim whitespace/newlines/quotes that often sneak in via paste.
          key="$(printf '%s' "$RAW_VT_API_KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          if [[ -z "$key" ]]; then
            echo "::error::VT_API_KEY secret is empty"
            exit 1
          fi
          echo "::add-mask::${key}"
          echo "VT_API_KEY length=${#key}"
          code="$(curl -sS -o /tmp/vt-me.json -w '%{http_code}' \
            -H "x-apikey: ${key}" \
            -H "Accept: application/json" \
            https://www.virustotal.com/api/v3/users/me)"
          echo "VirusTotal /users/me HTTP ${code}"
          if [[ "$code" != "200" ]]; then
            echo "::error::VirusTotal rejected VT_API_KEY (HTTP ${code}). Re-copy the key from https://www.virustotal.com/gui/my-apikey"
            head -c 400 /tmp/vt-me.json || true
            echo
            exit 1
          fi
          {
            echo "value<<EOF"
            printf '%s\n' "$key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Strip previous VirusTotal release notes
        if: steps.vt_key.outputs.value != '' && steps.release_meta.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: Nightly
          BODY: ${{ steps.release_meta.outputs.body }}
        run: |
          set -euo pipefail
          # softprops already wrote the fresh Nightly body; ensure no stale VT
          # section remains before the scan step appends a new one.
          notes_file="$(mktemp)"
          printf '%s\n' "${BODY}" > "${notes_file}"
          gh release edit "${TAG}" --notes-file "${notes_file}"
          rm -f "${notes_file}"

      - name: VirusTotal scan release assets
        id: vt
        if: steps.vt_key.outputs.value != ''
        uses: cssnr/virustotal-action@v2
        with:
          vt_api_key: ${{ steps.vt_key.outputs.value }}
          release_id: ${{ steps.release.outputs.id }}
          # Action default links use ephemeral /gui/file-analysis/ IDs that
          # often look stuck on "Enqueuing...". We rewrite to permanent
          # /gui/file/<sha256> URLs in the next step.
          update_release: false
          sha256: true
          release_heading: "**VirusTotal**"
          rate_limit: 4

      - name: Publish permanent VirusTotal links
        if: steps.vt.outputs.json != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: Nightly
          BODY: ${{ steps.release_meta.outputs.body }}
          VT_JSON: ${{ steps.vt.outputs.json }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            printf '%s\n\n' "${BODY}"
            echo "**VirusTotal**"
            echo
            python3 - <<'PY'
          import json, os
          items = json.loads(os.environ["VT_JSON"])
          for item in items:
              name = item.get("name") or "asset"
              sha = item.get("sha256") or ""
              if not sha:
                  # Fall back to analysis link only if hash is missing.
                  link = item.get("link") or ""
                  if link:
                      print(f"- [{name}]({link})")
                  continue
              # Skip checksum sidecars; the exe report is what people want.
              if name.endswith(".sha256"):
                  continue
              print(f"- [{name}](https://www.virustotal.com/gui/file/{sha})")
          PY
          } > "${notes_file}"
          gh release edit "${TAG}" --notes-file "${notes_file}"
          rm -f "${notes_file}"
